<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gundavaram">
<title>Gundavaram – Family Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ===== Theme: WhatsApp-style light green ===== */
:root{
  /* neutral surfaces (warm gray) + calm green accent */
  --bg:#F6F6F4; --card:#FFFFFF; --ink:#1C1C1A; --ink2:#44443F; --muted:#76766F; --line:#E6E5E1; --soft:#F1F0ED; --field:#FAFAF8;
  --brand:#12A37A; --brand-strong:#0B7A5B; --brand-soft:#E3F2EC; --brand-tint:#F0F7F3; --brand-ink:#FFFFFF;
  --over:#D9473F; --good:#12A37A; --warn:#C98A1B;
  --shadow:0 1px 2px rgba(28,28,26,.04),0 1px 6px rgba(28,28,26,.03);
  --shadow-lg:0 12px 32px rgba(28,28,26,.10),0 2px 6px rgba(28,28,26,.05);
  --scrim:rgba(20,20,18,.42);
  --c-home:#12A37A; --c-cal:#C9554E; --c-tasks:#5468C4; --c-shop:#C7772E; --c-money:#12A37A; --c-food:#4A9A68; --c-trips:#3D85C6; --c-meals:#C4623F; --c-notes:#8462B8; --c-family:#B95683; --c-time:#2F9488; --c-house:#2F8F7E;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:16px; --r-sm:12px;
  --sb:264px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --card:#1B1B1A; --ink:#F2F2EF; --ink2:#D0D0CB; --muted:#9C9C95; --line:#2C2C2A; --soft:#242422; --field:#20201E;
    --brand:#2BB88F; --brand-strong:#5ED3AE; --brand-soft:#1C3A30; --brand-tint:#182D26; --brand-ink:#0F1A16;
    --over:#EF6C64; --good:#5ED3AE;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121211; --card:#1B1B1A; --ink:#F2F2EF; --ink2:#D0D0CB; --muted:#9C9C95; --line:#2C2C2A; --soft:#242422; --field:#20201E;
  --brand:#2BB88F; --brand-strong:#5ED3AE; --brand-soft:#1C3A30; --brand-tint:#182D26; --brand-ink:#0F1A16;
  --over:#EF6C64; --good:#5ED3AE;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}

/* ===== Base ===== */
[hidden]{display:none!important}
html{font-size:100%;-webkit-text-size-adjust:100%}
html[data-size="l"]{font-size:118%}
html[data-size="xl"]{font-size:136%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 var(--font);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior-y:none;text-rendering:optimizeLegibility}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-d);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;transition:background-color .15s,color .15s,box-shadow .15s,transform .1s,border-color .15s}
button:active{transform:scale(.98)}
a{color:var(--brand-strong);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brand-soft)}
.svgi{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.svgi.cal text{fill:currentColor;stroke:none;font:700 8.5px/1 var(--font);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.right{margin-left:auto}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Shell ===== */
.shell{display:flex;min-height:100dvh}
.side{display:none}
.main{flex:1;min-width:0;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.page{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.page.wide{max-width:1100px}
.status{text-align:center;color:var(--muted);font-size:.72rem;padding:20px 0 4px}

/* bottom tab bar (phone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-right))}
.tab{min-height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.68rem;font-weight:600;border-radius:14px;padding:0}
.tab:active{transform:none}
.tab .ic{display:grid;place-items:center;width:58px;height:30px;border-radius:99px;transition:background-color .2s,color .2s}
.tab .ic .svgi{width:23px;height:23px}
.tab .tl{white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{background:var(--brand-soft);color:var(--brand-strong)}
.tab[aria-current="page"] .svgi{stroke-width:2.1}

/* side nav (laptop) */
@media (min-width:900px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:2px;width:var(--sb);flex:none;padding:20px 12px;position:sticky;top:0;height:100dvh;overflow:auto;border-right:1px solid var(--line);background:var(--card)}
  .main{padding:32px 40px 64px}
  .brandrow{display:flex;align-items:center;gap:12px;padding:2px 10px 20px}
  .brandrow b{display:block;font-family:var(--font-d);font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
  .brandrow small{display:block;color:var(--muted);font-size:.75rem;font-weight:500}
  .navi{display:flex;align-items:center;gap:14px;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;font-weight:500;font-size:.95rem;color:var(--ink2);text-align:left;width:100%}
  .navi .ic{display:grid;place-items:center;width:24px;color:var(--muted)}
  .navi .ic .svgi{width:21px;height:21px}
  .navi:hover{background:var(--soft)}
  .navi[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
  .navi[aria-current="page"] .ic{color:var(--brand-strong)}
  .navsp{flex:1}
}

/* ===== Page header ===== */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 2px 2px}
.phead h1{font-size:1.85rem;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.phead .sub{color:var(--muted);font-size:.88rem;margin-top:3px}
.acts{display:flex;gap:8px;align-items:center}

/* ===== Controls ===== */
.btn{min-height:44px;padding:0 18px;border:1px solid transparent;border-radius:var(--r-sm);background:var(--soft);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.95rem}
.btn:hover{background:color-mix(in srgb,var(--soft) 70%,var(--line))}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(20,30,26,.16)}
.btn.primary:hover{background:var(--brand-strong)}
:root[data-theme="dark"] .btn.primary{color:var(--brand-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:var(--brand-ink)}}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:.86rem;border-radius:10px}
.btn.link{background:none;color:var(--brand-strong);padding:0 6px;min-height:40px}
.btn.link:hover{background:none;text-decoration:underline}
.btn.danger{color:var(--over)}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--card);font-size:1.15rem;display:grid;place-items:center;flex:none;color:var(--ink2)}
.ibtn:hover{background:var(--soft)}
.ibtn.plain{background:var(--soft);border-color:transparent}
.ibtn.brand{background:var(--brand);border-color:var(--brand);color:#fff;font-size:1.5rem;line-height:1}
.ibtn[disabled]{opacity:.35}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border:0;border-radius:9px;background:none;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap;padding:0 10px}
.seg button:active{transform:none}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(11,20,26,.1)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-weight:500;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.chip:hover{background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 45%,transparent);color:var(--brand-strong);font-weight:600}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}

/* ===== Cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tap{text-align:left;width:100%}
.card.tap:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line));box-shadow:var(--shadow-lg)}
.card h2{font-size:1rem;font-weight:650;letter-spacing:-.01em}
.chead{display:flex;align-items:center;gap:12px}
.ico{--ac:var(--brand);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--ac) 13%,transparent);color:var(--ac)}
.ico .svgi{width:20px;height:20px}
.chead h2{flex:1}
.chead .more{color:var(--brand-strong);font-weight:600;font-size:.84rem;border:0;background:none;min-height:34px;padding:0 10px;border-radius:99px}
.chead .more:hover{background:var(--brand-tint)}
.chead .chev{color:var(--muted);font-size:1.4rem;line-height:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi b{display:block;font-family:var(--font-d);font-size:clamp(.95rem,4.4vw,1.25rem);font-weight:700;letter-spacing:-.02em}
.kpi span{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-height:52px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit}
button.item:hover{background:linear-gradient(90deg,transparent,var(--soft) 12%,var(--soft) 88%,transparent)}
button.item:active{transform:none}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .t b{font-weight:600;display:block}
.item .t small{display:block;color:var(--muted);font-size:.8rem}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.92rem}
.empty .big{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--brand-tint);color:var(--brand-strong)}
.empty .big .svgi{width:24px;height:24px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand);width:0;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bar i.over{background:var(--over)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;flex:none;background:var(--soft)}
.avatar.lg{width:54px;height:54px;font-size:1.7rem}
.avs{display:flex}
.avs .avatar{width:26px;height:26px;font-size:.8rem;border:2px solid var(--card);margin-left:-8px}
.avs .avatar:first-child{margin-left:0}
.pill{font-size:.7rem;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.red{background:color-mix(in srgb,var(--over) 13%,transparent);color:var(--over)}
.pill.green{background:var(--brand-soft);color:var(--brand-strong)}
.pill.brand{background:var(--brand-soft);color:var(--brand-strong)}

.check{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 70%,transparent);background:none;flex:none;display:grid;place-items:center;font-size:.85rem;color:transparent;padding:0}
.check:hover{border-color:var(--brand)}
.check[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.done .t b{text-decoration:line-through;color:var(--muted)}

/* ===== Home ===== */
.hero{position:relative;overflow:hidden;background:radial-gradient(420px 220px at 100% 0%,rgba(43,184,143,.45),transparent 70%),linear-gradient(135deg,#23231F 0%,#163A30 100%);color:#fff;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(20,30,26,.18)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero::before{width:220px;height:220px;right:-60px;top:-90px}
.hero::after{width:140px;height:140px;right:70px;bottom:-80px;background:rgba(94,211,174,.10)}
.hero h1{position:relative;font-size:1.6rem;font-weight:700;letter-spacing:-.025em;color:#fff}
.hero p{position:relative;opacity:.88;font-size:.92rem}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:.74rem;font-weight:600;color:var(--ink2);padding:8px 2px}
.quick button:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.quick .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand-tint);color:var(--brand-strong)}
.quick .qi .svgi{width:21px;height:21px}
@media (max-width:420px){.quick{gap:6px}.quick button{min-height:74px;font-size:.66rem;border-radius:14px}.quick .qi{width:34px;height:34px}}

.fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right));bottom:calc(88px + env(safe-area-inset-bottom));height:54px;min-width:54px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--brand);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(11,122,91,.28),0 2px 4px rgba(0,0,0,.08);font-size:.98rem}
.fab:hover{background:var(--brand-strong)}
.fab .svgi{width:22px;height:22px;stroke-width:2.2}
@media (min-width:900px){.fab{bottom:32px;right:40px}}

/* ===== Forms ===== */
.quickadd{display:flex;gap:8px}
.quickadd input{flex:1}
input,select,textarea{min-height:46px;padding:9px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--field);width:100%;font-size:1rem;transition:border-color .15s,box-shadow .15s,background-color .15s}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--muted) 40%,var(--line))}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent);outline:none}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:.78rem;color:var(--ink2);font-weight:600}
.form{display:flex;flex-direction:column;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input.money{font-size:2rem;font-weight:700;text-align:center;min-height:64px;letter-spacing:-.02em}
.togrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;font-weight:500}
.togrow input{width:22px;height:22px;min-height:0;accent-color:var(--brand)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--brand)}

/* ===== Sheets & overlays ===== */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.panel{width:100%;max-width:560px;max-height:94dvh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-lg)}
.panel::before{content:"";width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto -2px;flex:none}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:2px}
.panelhead h2{font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .26s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
@media (min-width:640px){.sheet{align-items:center}.panel{border-radius:20px;padding:18px 22px 24px}.panel::before{display:none}}
.gate{position:fixed;inset:0;z-index:60;background:radial-gradient(1200px 500px at 50% -10%,var(--brand-soft),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gatecard{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;box-shadow:var(--shadow-lg)}
.gatecard h1{font-size:1.5rem;font-weight:700;letter-spacing:-.025em}
.logo{width:64px;height:64px;border-radius:20px;margin:0 auto 4px;background:linear-gradient(135deg,#2BB88F,#0B7A5B);display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(11,122,91,.22)}
.logo .svgi{width:32px;height:32px;stroke-width:2}
.logo.sm{width:38px;height:38px;border-radius:12px;margin:0;box-shadow:0 3px 8px rgba(20,30,26,.16)}
.logo.sm .svgi{width:20px;height:20px}
.toastwrap{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));z-index:70;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
@media (min-width:900px){.toastwrap{bottom:28px}}
.toast{pointer-events:auto;background:#23231F;color:#F2F2EF;border-radius:12px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:12px;font-weight:500;font-size:.92rem;max-width:100%;box-shadow:var(--shadow-lg)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .22s cubic-bezier(.2,.8,.2,1)}}
.toast button{min-height:42px;padding:0 12px;border:0;background:none;color:#5ED3AE;font-weight:700}

/* ===== Calendar ===== */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mgrid .dow{font-size:.68rem;font-weight:600;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.mday{min-height:46px;border:0;border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500;font-size:.95rem;padding:2px 0;color:var(--ink)}
.mday:hover{background:var(--soft)}
.mday:active{transform:none}
.mday.out{color:var(--muted);opacity:.45}
.mday.today b{color:var(--brand-strong);font-weight:700}
.mday.today{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 55%,transparent)}
.mday[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(11,122,91,.22)}
.mday[aria-pressed="true"].today b{color:#fff}
.mday .dots{display:flex;gap:2px;height:6px}
.mday .dots i{width:5px;height:5px;border-radius:50%;background:var(--brand)}
.mday[aria-pressed="true"] .dots i{background:#fff}
.evbar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.tt{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.ttcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.ttcol h3{font-size:.8rem;text-align:center;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ttcell{border-radius:10px;padding:8px 10px;font-size:.85rem;background:var(--brand-tint);border-left:3px solid var(--brand);border-top:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.ttcell b{display:block;font-weight:600}
@media (max-width:899px){.tt{grid-template-columns:1fr}.ttcol:not(.sel){display:none}.ttcol h3{display:none}}

/* ===== Charts & food ===== */
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px;font-size:.88rem}

.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--soft)}
.ring .tx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .tx b{font-family:var(--font-d);font-size:1.6rem;font-weight:700;line-height:1;letter-spacing:-.02em}

.week svg{width:100%;height:auto;display:block}

.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:40dvh;overflow:auto}
.result{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;min-height:56px;padding:8px 10px;border:0;border-radius:12px;background:none}
.result:hover,.result.top{background:var(--brand-tint)}

.result .sv{display:block;color:var(--muted);font-size:.82rem}
.grp{padding:10px 4px 4px;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;list-style:none}
.qtyrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:end}

.bigcal{font-family:var(--font-d);font-size:2.2rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.pv{font-size:.78rem}
.macrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macrow div{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:500}
.pill-tag{font-style:normal;font-size:.66rem;background:var(--brand-soft);color:var(--brand-strong);border-radius:99px;padding:1px 8px;margin-left:8px;font-weight:600}
@media (max-width:380px){.kpis{grid-template-columns:1fr 1fr}.phead h1{font-size:1.6rem}}

/* badges, link buttons */
.ic{position:relative}
.badge{position:absolute;top:-3px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--over);color:#fff;font:700 .62rem/17px var(--font);text-align:center;box-shadow:0 0 0 2px var(--card)}

/* shopping: compact list */

.shoplist{padding:6px 14px 8px;gap:0}
.aisle{break-inside:avoid;padding-bottom:4px}
.aislehead{display:flex;align-items:center;justify-content:space-between;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 0 4px;border-bottom:1px solid var(--line)}

.srow{display:flex;align-items:center;gap:10px;min-height:42px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}

.basket{padding:4px 14px}

.calfrac{font-family:var(--font-d);letter-spacing:-.02em;line-height:1.1;margin-top:2px}

.mlab{display:flex;justify-content:space-between;align-items:baseline;gap:6px;color:var(--ink2)}
.mlab .num{color:var(--muted);font-size:.74rem;white-space:nowrap}
.mlab .num b{color:var(--ink);font-weight:600;font-size:.82rem}
.plan{display:flex;flex-direction:column;gap:12px}
.plangrid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px}
.pcell{background:var(--soft);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pcell span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.pcell b{font-family:var(--font-d);font-size:1.15rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.pcell small{font-size:.7rem;color:var(--muted)}
.pcell.cal{background:var(--brand-soft)}.pcell.cal b{color:var(--brand-strong)}
details.manual{border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.manual>summary{min-height:46px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none}
details.manual>summary::-webkit-details-marker{display:none}
details.manual[open]{padding-bottom:14px}
@media (max-width:380px){.plangrid{grid-template-columns:1fr 1fr}}

<div class="toastwrap" id="toastWrap" hidden></div>
<script src="app-config.js"></script>
<script>
(function(){
'use strict';
/* ================= helpers ================= */
var CFG=window.APP_CONFIG||{};
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
function h(tag,props){
  var e=document.createElement(tag);
  if(props){for(var k in props){var v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k==='style'&&typeof v==='object'){for(var s in v)e.style[s]=v[s]}
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v);}}
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){var c=kids[j];if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  }
  return e;
}
function pad(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseD(s){var a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function today(){return dstr(new Date())}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)}
function diffDays(a,b){return Math.round((parseD(a)-parseD(b))/864e5)}
function monthKey(s){return s.slice(0,7)}
function addMonths(mk,n){var a=mk.split('-').map(Number),d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function monthLabel(mk){var a=mk.split('-').map(Number);return new Date(a[0],a[1]-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}
function dayLabel(s,long){return parseD(s).toLocaleDateString('en-US',long?{weekday:'long',month:'long',day:'numeric'}:{weekday:'short',month:'short',day:'numeric'})}
function relDay(s){var t=today(),d=diffDays(s,t);return d===0?'Today':d===1?'Tomorrow':d===-1?'Yesterday':dayLabel(s)}
function fmtTime(t){if(!t)return '';var a=t.split(':').map(Number),hh=a[0]%12||12;return hh+(a[1]?':'+pad(a[1]):'')+(a[0]<12?' AM':' PM')}
function fmt(n){return Math.round(n).toLocaleString('en-US')}
function r1(n){return Math.round(n*10)/10}
function fmtQty(q){return q%1===0?String(q):String(r1(q))}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(v,max){v=Number(v);if(!isFinite(v)||v<0)return 0;return Math.min(v,max||1e9)}
function sum(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}
function money(n,dec){
  var c=(S.fam&&S.fam.currency)||'$',neg=n<0;n=Math.abs(n);
  var s=n.toLocaleString('en-US',{minimumFractionDigits:dec?2:(n%1?2:0),maximumFractionDigits:2});
  return (neg?'−':'')+c+s;
}
function firstName(n){return String(n||'').trim().split(/\s+/)[0].slice(0,30)}
function clean(o){return JSON.parse(JSON.stringify(o))}
function greet(){var hh=new Date().getHours();return hh<5?'Good night':hh<12?'Good morning':hh<18?'Good afternoon':'Good evening'}

/* ================= state ================= */
var S={mode:'local',uid:'local',fam:{currency:'$',name:'Our family'},famId:null,members:{},ready:false,auth:null};
var EMOJIS=['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐻','🐶','🐱','🦁','🐧'];
var COLORS=['#12A37A','#EF4444','#10B981','#F59E0B','#0EA5E9','#EC4899','#8B5CF6','#14B8A6'];
function me(){return S.members[S.uid]||{name:'Me',emoji:'🦊',color:COLORS[0]}}
function memberList(){return Object.keys(S.members).map(function(id){return Object.assign({id:id},S.members[id])}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'')})}
function nameOf(uid){var m=S.members[uid];return uid===S.uid?(m&&m.name)||'Me':(m&&m.name)||'Family'}
function avatar(uid,cls){var m=S.members[uid]||{};return h('span',{class:'avatar'+(cls?' '+cls:''),style:{background:(m.color||'#999')+'33'},title:m.name||'','aria-label':m.name||''},m.emoji||'🙂')}
function avatars(ids){
  ids=(ids&&ids.length)?ids:null;
  if(!ids)return h('span',{class:'pill',text:'Everyone'});
  return h('span',{class:'avs'},ids.slice(0,4).map(function(u){return avatar(u)}));
}

/* ================= store ================= */
var Store={cloud:false,fdb:null,FS:null,cols:{},ucols:{},unsubs:[]};
var FAMCOLS=['events','tasks','shop','txns','bills','house','budgets','goals','trips','notes','meals'];
var refreshQueued=false;
function refresh(){
  if(refreshQueued)return;refreshQueued=true;
  requestAnimationFrame(function(){refreshQueued=false;if(App.upd){try{App.upd()}catch(e){console.error(e)}}try{updBadge()}catch(e){}});
}
function LSget(k,d){try{var j=JSON.parse(localStorage.getItem(k));return j==null?d:j}catch(e){return d}}
function LSset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

function makeCol(segs,opts){
  opts=opts||{};
  var C={items:[],map:{},subs:[],ready:false,ro:!!opts.ro,unsub:null};
  var lsKey='nourish2:'+segs.map(function(x,i){return (x===S.famId||x===S.uid)&&i>0?'_':x}).join('/');
  function set(list){C.items=list;C.map={};list.forEach(function(i){C.map[i.id]=i});C.ready=true;C.subs.slice().forEach(function(f){f(C.items)});refresh()}
  function fsCol(){return Store.FS.collection.apply(null,[Store.fdb].concat(segs))}
  if(Store.cloud){
    C.unsub=Store.FS.onSnapshot(fsCol(),function(snap){set(snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})}))},function(){C.ready=true;refresh()});
  }else{set(Object.keys(LSget(lsKey,{})).map(function(k){return LSget(lsKey,{})[k]}))}
  C.get=function(id){return C.map[id]};
  C.save=function(o){
    if(C.ro)return Promise.reject(new Error('read only'));
    if(!o.id)o.id=newId();
    var data=clean(o);
    if(Store.cloud){return Store.FS.setDoc(Store.FS.doc.apply(null,[Store.fdb].concat(segs,[o.id])),data).catch(function(e){setStatus('Could not save: '+(e&&e.code==='permission-denied'?'database rules block this (see README).':'no connection.'));throw e})}
    var m=LSget(lsKey,{});m[o.id]=data;LSset(lsKey,m);set(Object.keys(m).map(function(k){return m[k]}));
    return Promise.resolve();
  };
  C.add=function(o){var id=newId();C.save(Object.assign({},o,{id:id,by:S.uid,at:Date.now()}));return id};
  C.patch=function(id,p){var o=Object.assign({},C.map[id]||{id:id},p);return C.save(o)};
  C.del=function(id){
    if(C.ro)return Promise.resolve();
    if(Store.cloud)return Store.FS.deleteDoc(Store.FS.doc.apply(null,[Store.fdb].concat(segs,[id])));
    var m=LSget(lsKey,{});delete m[id];LSset(lsKey,m);set(Object.keys(m).map(function(k){return m[k]}));return Promise.resolve();
  };
  C.on=function(f){C.subs.push(f);if(C.ready)f(C.items);return function(){C.subs=C.subs.filter(function(x){return x!==f})}};
  return C;
}
function col(name){return Store.cols[name]||(Store.cols[name]=makeCol(['families',S.famId||'local',name]))}
function ucol(uid,name){
  var k=uid+'/'+name;
  return Store.ucols[k]||(Store.ucols[k]=makeCol(['users',uid,name]));
}
function saveMe(patch){
  Object.assign(S.members[S.uid]=S.members[S.uid]||{},patch);
  if(Store.cloud){var FS=Store.FS;return Promise.all([FS.setDoc(FS.doc(Store.fdb,'users',S.uid),clean(patch),{merge:true}),
    FS.setDoc(FS.doc(Store.fdb,'families',S.famId,'members',S.uid),clean(patch),{merge:true})])}
  LSset('nourish2:me',S.members[S.uid]);refresh();return Promise.resolve();
}
// Save profile/details for any family member (everyone in the family may edit anyone).
function savePerson(uid,patch){
  if(uid===S.uid)return saveMe(patch);
  Object.assign(S.members[uid]=S.members[uid]||{},patch);refresh();
  if(Store.cloud)return Store.FS.setDoc(Store.FS.doc(Store.fdb,'families',S.famId,'members',uid),clean(patch),{merge:true});
  return Promise.resolve();
}
function saveFam(patch){
  Object.assign(S.fam,patch);
  if(Store.cloud){return Store.FS.setDoc(Store.FS.doc(Store.fdb,'families',S.famId),clean(patch),{merge:true})}
  LSset('nourish2:fam',S.fam);refresh();return Promise.resolve();
}
function setStatus(t){var e=$('#status');if(e)e.textContent=t}

/* connect */
function gate(content){var el=h('div',{class:'gate'},h('div',{class:'gatecard'},content));document.body.append(el);return el}
function gateSignIn(AU,auth){
  return new Promise(function(res){
    var msg=h('div',{class:'muted small','aria-live':'polite'});
    var el=gate([h('div',{class:'logo','aria-hidden':'true'},ico('home')),h('h1',{text:'Welcome to Gundavaram'}),
      h('p',{class:'muted',text:'One home for your family: calendar, chores, shopping, budget, trips and more.'}),
      h('button',{class:'btn primary wide',type:'button',onclick:async function(){
        msg.textContent='Opening Google…';
        try{var cred=await AU.signInWithPopup(auth,new AU.GoogleAuthProvider());el.remove();res(cred.user)}
        catch(e){msg.textContent=e&&e.code==='auth/unauthorized-domain'?'This web address is not allowed yet. In Firebase: Authentication → Settings → Authorized domains → add it.':'Sign-in did not finish. Please try again.'}
      }},'Continue with Google'),msg,
      h('button',{class:'btn link',type:'button',onclick:function(){el.remove();res('local')}},'Try it on this device only')]);
  });
}
function gateFamily(FS,fdb,uid,email,note){
  return new Promise(function(res){
    var msg=h('div',{class:'muted small','aria-live':'polite'}),el;
    var codeIn=h('input',{type:'text',placeholder:'Family code',maxlength:'10',autocapitalize:'characters','aria-label':'Family code',style:{textAlign:'center',letterSpacing:'.15em',fontWeight:'700'}});
    var nameIn=h('input',{type:'text',placeholder:'Family name, e.g. The Gundavarams',maxlength:'40','aria-label':'Family name'});
    function done(code){el.remove();res(code)}
    el=gate([h('div',{class:'logo','aria-hidden':'true'},ico('users')),h('h1',{text:'Set up your family'}),
      note?h('p',{class:'muted small',text:note}):null,
      h('p',{class:'muted',text:'Start a new family space, or join one with a code from a family member. To join, the family owner must first add your email ('+email+') in Family & settings.'}),
      nameIn,
      h('button',{class:'btn primary wide',type:'button',onclick:async function(){
        var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code='',buf=new Uint8Array(8);crypto.getRandomValues(buf);for(var i=0;i<8;i++)code+=chars[buf[i]%chars.length];
        msg.textContent='Creating…';
        try{await FS.setDoc(FS.doc(fdb,'families',code),{owner:uid,allowed:[email],created:Date.now(),name:nameIn.value.trim()||'Our family',currency:'$'});done(code)}
        catch(e){msg.textContent='Could not create the family. Check the database rules (README, step 1.4).'}
      }},'Start a new family'),
      h('div',{class:'muted',text:'or join one'}),codeIn,
      h('button',{class:'btn wide',type:'button',onclick:async function(){
        var code=codeIn.value.trim().toUpperCase();if(code.length<6){msg.textContent='Type the family code first.';return}
        msg.textContent='Checking…';
        try{var s=await FS.getDoc(FS.doc(fdb,'families',code));if(!s.exists()){msg.textContent='No family found with that code.';return}done(code)}
        catch(e){msg.textContent=e&&e.code==='permission-denied'?'Could not join. Check the code, and ask the family owner to add '+email+' in Family & settings.':'Could not check the code. Try again.'}
      }},'Join with a code'),msg]);
  });
}
async function connect(){
  var cfg=CFG.firebase;
  if(!cfg||!cfg.apiKey||/^PASTE/i.test(cfg.apiKey))return false;
  var B='https://www.gstatic.com/firebasejs/10.12.2/';
  var m=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  var A=m[0],AU=m[1],FS=m[2];
  var app=A.initializeApp(cfg),auth=AU.getAuth(app),fdb;
  try{fdb=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})})}catch(e){fdb=FS.getFirestore(app)}
  var user=await new Promise(function(r){var un=AU.onAuthStateChanged(auth,function(u){un();r(u)})});

var KINDS=[['event','Event','📌'],['appt','Appointment','🩺'],['school','School','🎒'],['work','Work','💼'],['activity','Activity','⚽'],['birthday','Birthday','🎂']];
var KIND_COLOR={event:'#12A37A',appt:'#EF4444',school:'#F59E0B',work:'#0EA5E9',activity:'#10B981',birthday:'#EC4899'};
function kindIcon(k){var x=KINDS.filter(function(a){return a[0]===k})[0];return x?x[2]:'📌'}
function occurs(ev,date){
  if(!ev.date||date<ev.date)return false;
  if(ev.until&&date>ev.until)return false;
  var rp=ev.repeat||'none',d=parseD(date),s=parseD(ev.date);
  if(rp==='none')return date===ev.date;
  if(rp==='daily')return true;
  if(rp==='weekly'){var days=(ev.days&&ev.days.length)?ev.days:[s.getDay()];return days.indexOf(d.getDay())>=0}
  if(rp==='monthly')return d.getDate()===s.getDate();
  if(rp==='yearly')return d.getDate()===s.getDate()&&d.getMonth()===s.getMonth();
  return false;
}
function eventsOn(date,who){
  return col('events').items.filter(function(e){
    if(!occurs(e,date))return false;
    if(who&&e.who&&e.who.length&&e.who.indexOf(who)<0)return false;
    return true;
  }).sort(function(a,b){return (a.time||'')<(b.time||'')?-1:1});

  m=txt.trim().match(/^(.+?)\s*(?:x|×)\s*(\d+)$/i);

}

  var lists=h('div'),body=h('div',{style:{display:'flex',flexDirection:'column',gap:'16px'}});
  var input=h('input',{type:'text',placeholder:'Add item… (2 milk, bread)','aria-label':'Add shopping item',enterkeyhint:'done',maxlength:'80'});
  var sug=h('div',{class:'chips scroll'});
  function quick(){var v=input.value.trim();if(!v)return;addShopItems(v,curList);input.value='';drawSug();input.focus()}

    sug.replaceChildren();var q=input.value.trim().toLowerCase();if(!q)return;
    var seen={},pool=col('shop').items.map(function(i){return i.name}).concat(COMMON_ITEMS).filter(function(n){var k=n.toLowerCase();if(seen[k])return false;seen[k]=1;return true});
    pool.filter(function(n){return n.toLowerCase().indexOf(q)===0&&n.toLowerCase()!==q}).slice(0,8).forEach(function(n){sug.append(h('button',{class:'chip',type:'button',onclick:function(){input.value=n;quick()}},n))});
  }
  input.addEventListener('input',drawSug);
  input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();quick()}});
  var head=h('div');
  function shareList(open){
    var text=curList+':\n'+open.map(function(i){return '• '+i.name+(i.qty?' ('+i.qty+')':'')}).join('\n');
    if(navigator.share)navigator.share({title:curList,text:text}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(function(){toast('List copied')});
  }
  el.append(head,segControl([['t','Tasks'],['s','Shopping']],'s',function(v){if(v==='t')go('tasks')}),
    h('div',{class:'quickadd shopadd'},input,h('button',{class:'ibtn brand',type:'button','aria-label':'Add item',onclick:quick},ico('plus'))),sug,lists,body);
  function upd(){
    var ls=shopLists();if(ls.indexOf(curList)<0)curList='Groceries';
    lists.replaceChildren();
    var g=chipGroup(ls.map(function(l){return [l,l]}).concat([['__new','＋ New list']]),curList,false,function(v){
      if(v==='__new'){
        var ni=h('input',{type:'text',placeholder:'e.g. Costco, Pharmacy, Party',maxlength:'30','aria-label':'List name'});
        var el2=openSheet('New list',h('form',{class:'form',onsubmit:function(e){e.preventDefault();var n=ni.value.trim();if(!n)return;curList=n;if(extraShopLists.indexOf(n)<0)extraShopLists.push(n);el2.close();upd()}},ni,h('button',{class:'btn primary wide',type:'submit'},'Create list'),h('div',{class:'muted small',text:'Then add items from the box above.'})));
        return;}
      curList=v;upd()});
    g.classList.add('scroll');lists.append(g);
    var items=col('shop').items.filter(function(i){return i.list===curList});
    var open=items.filter(function(i){return !i.done}),done=items.filter(function(i){return i.done});
    body.replaceChildren();

      open.length?[h('button',{class:'btn sm',type:'button',onclick:function(){shareList(open)}},'Share')]:null));
    if(!open.length)body.append(h('div',{class:'card'},emptyState('🛒','Nothing to buy. Type an item above.')));
    else{
      // one compact card, grouped by aisle
      var card=h('section',{class:'card shoplist'});
      SHOP_CATS.forEach(function(c){
        var rows=open.filter(function(i){return (i.cat||'other')===c[0]});if(!rows.length)return;
        var g=h('div',{class:'aisle'},h('div',{class:'aislehead'},h('span',{text:String(c[1]).replace(/^[^A-Za-z0-9]+/,'')}),h('span',{class:'cnt',text:rows.length})));
        rows.sort(function(a,b){return a.name<b.name?-1:1}).forEach(function(x){g.append(shopRow(x))});card.append(g);
      });
      body.append(card);
    }
    if(done.length){
      var l2=h('div',{class:'shoplist'});done.forEach(function(x){l2.append(shopRow(x))});
      body.append(h('details',{class:'card basket'},h('summary',null,h('span',{class:'grow',text:'In the basket · '+done.length}),
        h('button',{class:'btn sm danger',type:'button',onclick:function(e){e.preventDefault();done.forEach(function(x){col('shop').del(x.id)});toast('Cleared')}},'Clear')),l2));
    }

}

function billDue(b,mk){
  var dt=mk.split('-').map(Number),last=new Date(dt[0],dt[1],0).getDate(),day=Math.min(Number(b.day)||1,last);
  return mk+'-'+pad(day);
}
function dueBills(){
  var t=today(),mk=monthKey(t),out=[];
  col('bills').items.forEach(function(b){
    if(b.paid&&b.paid[mk])return;
    var d=billDue(b,mk),diff=diffDays(d,t);
    if(diff<=7)out.push({id:b.id,name:b.name,amount:b.amount,dueDate:d,late:diff<0});

/* search helpers */
function lev(a,b){var m=a.length,n=b.length,i,j,row=[],prev,tmp;for(j=0;j<=n;j++)row[j]=j;for(i=1;i<=m;i++){prev=row[0];row[0]=i;for(j=1;j<=n;j++){tmp=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a.charAt(i-1)===b.charAt(j-1)?0:1));prev=tmp}}return row[n]}
function scoreFood(f,toks){
  var name=f.name.toLowerCase(),words=name.split(/[^a-z0-9]+/).filter(Boolean),total=0;
  for(var i=0;i<toks.length;i++){var t=toks[i],s=0;
    if(words.some(function(w){return w.indexOf(t)===0}))s=4;
    else if(name.indexOf(t)>=0)s=3;
    else if(t.length>=3&&words.some(function(w){return lev(t,w.slice(0,t.length))<=1}))s=2;
    else if(t.length>=4&&words.some(function(w){return lev(t,w)<=2}))s=1.5;
    if(!s)return 0;total+=s}
  return total+(f.mine?0.5:0)-name.length/1000;
}
function sameFood(a,b){return a.name.trim().toLowerCase()===b.name.trim().toLowerCase()&&(a.serving||'').trim().toLowerCase()===(b.serving||'').trim().toLowerCase()}
function myFoods(){return ucol(S.uid,'foods').items}
function allFoods(){
  var mine=myFoods().map(function(f){return Object.assign({},f,{mine:true})});
  return mine.concat(FOODS.filter(function(f){return !mine.some(function(m){return sameFood(m,f)})}));
}
function recentFoods(){
  var all=allFoods(),out=[],seen={},days=ucol(S.uid,'days').items.slice().sort(function(a,b){return a.date<b.date?1:-1});
  days.some(function(d){d.entries.slice().reverse().some(function(e){
    var f=all.filter(function(x){return sameFood(x,e)})[0];
    if(f&&!seen[f.name+'|'+f.serving]){seen[f.name+'|'+f.serving]=1;out.push(f)}return out.length>=6});return out.length>=6});
  return out;
}
function rememberFood(f){
  var c=ucol(S.uid,'foods'),ex=c.items.filter(function(x){return sameFood(x,f)})[0];
  var rec={id:ex?ex.id:newId(),name:f.name,serving:f.serving||'1 serving',cal:Math.round(f.cal),p:r1(f.p||0),c:r1(f.c||0),f:r1(f.f||0)};
  if(f.k){rec.k=f.k;rec.a=f.a;if(f.w)rec.w=f.w}
  c.save(rec);
}
function unitsFor(f){
  var u=[{u:'serving',label:'serving',per:1,step:0.5}];
  if(f.k==='g'&&f.a)u.push({u:'g',label:'grams (g)',per:f.a,step:10});
  if(f.k==='ml'&&f.a)u.push({u:'ml',label:'millilitres (ml)',per:f.a,step:10});
  if(f.k==='pc'&&f.a)u.push({u:'pc',label:'pieces',per:f.a,step:1});
  if(f.k&&f.k!=='g'&&f.w)u.push({u:'g',label:'grams (g)',per:f.w,step:10});
  return u;
}
function searchPackaged(q){
  var url='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=20&fields=product_name,brands,nutriments';
  return fetch(url).then(function(r){if(!r.ok)throw new Error('http');return r.json()}).then(function(j){
    var seen={};
    return (j.products||[]).map(function(p){
      var n=p.nutriments||{},kcal=Number(n['energy-kcal_100g']);
      if(!p.product_name||!(kcal>0)||kcal>950)return null;
      var brand=p.brands?String(p.brands).split(',')[0].trim():'',name=(p.product_name+(brand?' ('+brand+')':'')).slice(0,80);
      if(seen[name])return null;seen[name]=1;
      return {name:name,serving:'100 g',cal:Math.round(kcal),p:r1(n.proteins_100g||0),c:r1(n.carbohydrates_100g||0),f:r1(n.fat_100g||0),k:'g',a:100};
    }).filter(Boolean).slice(0,12);
  });
}

function aiKey(){var k=S.fam.geminiKey||CFG.geminiKey||'';return /^PASTE/i.test(k)?'':k}

async function aiEstimate(text){
  var model=CFG.geminiModel||'gemini-3.8-flash';
  var prompt='Estimate the nutrition of this food or meal: "'+text.replace(/"/g,"'")+'"\nIf it is several foods, split it into separate items. Where no portion is given, assume one typical home portion and say which in "serving". Reply with only a JSON array. Each item is {"name": string, "serving": string, "calories": number, "protein": number, "carbs": number, "fat": number} where the numbers describe that whole serving and macros are grams. Example: [{"name":"Boiled egg","serving":"2 large","calories":156,"protein":12.6,"carbs":1.2,"fat":10.6}]';
  var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':aiKey()},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.2}})});
  if(!r.ok){var er=new Error('http');er.status=r.status;throw er}
  var j=await r.json(),t=j.candidates[0].content.parts.map(function(p){return p.text||''}).join('');
  var arr=JSON.parse(t.replace(/^```(?:json)?|```$/g,'').trim());
  if(!Array.isArray(arr))throw new Error('shape');return arr;
}

/* ================= HOUSEHOLD: insurance, utilities, loans, subscriptions, deadlines ================= */
var HTYPES=[
  ['insurance','Insurance','shield','var(--c-trips)'],
  ['utility','Bills & utilities','bolt','var(--c-shop)'],
  ['loan','Mortgage & loans','bank','var(--c-tasks)'],
  ['subscription','Subscriptions','repeat','var(--c-notes)'],
  ['deadline','Other deadlines','hourglass','var(--c-cal)']
];
var HREPEAT=[['monthly','Every month'],['quarterly','Every 3 months'],['yearly','Every year'],['once','One time']];
var HREPEAT_MONTHS={monthly:1,quarterly:3,yearly:12};
function htype(id){return HTYPES.filter(function(t){return t[0]===id})[0]||HTYPES[4]}
function defRemind(rep){return {monthly:3,quarterly:7,yearly:30,once:14}[rep]||7}
function repLabel(r){var o=HREPEAT.filter(function(x){return x[0]===r})[0];return o?o[1]:''}

// Move a date forward by whole months, keeping the original day (31st -> last day of shorter months).
function addMonthsKeep(s,n,day){
  var a=s.split('-').map(Number),y=a[0],m=a[1]-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;
  var last=new Date(y,m+1,0).getDate();return y+'-'+pad(m+1)+'-'+pad(Math.min(day||a[2],last));
}
function nextDue(it){var n=HREPEAT_MONTHS[it.repeat];return n?addMonthsKeep(it.due,n,it.day):null}
// Autopay items roll forward on their own once the date has passed.
function effDue(it){
  var d=it.due,t=today(),n=HREPEAT_MONTHS[it.repeat],guard=0;
  if(it.autopay&&n){while(d<t&&guard++<240)d=addMonthsKeep(d,n,it.day)}
  return d;
}
function houseItems(){return col('house').items.filter(function(x){return !x.done})}
// Everything inside its reminder window (or overdue), soonest first.
function houseDue(){
  var t=today(),out=[];
  houseItems().forEach(function(it){
    if(it.due){
      var d=effDue(it),days=diffDays(d,t),rem=it.remind==null||it.remind===''?defRemind(it.repeat):Number(it.remind);
      if(days<=rem)out.push({it:it,kind:'due',date:d,days:days,late:days<0&&!it.autopay});
    }
    if(it.type==='subscription'&&it.cancelBy&&!it.cancelDone){
      var cd=diffDays(it.cancelBy,t);
      if(cd<=7)out.push({it:it,kind:'cancel',date:it.cancelBy,days:cd,late:cd<0});
    }
  });
  return out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
}
function whenText(days){
  return days<0?(-days)+' day'+(days===-1?'':'s')+' overdue':days===0?'Today':days===1?'Tomorrow':'In '+days+' days';
}
function safeUrl(u){
  u=String(u||'').trim();if(!u)return '';
  if(!/^[a-z]+:\/\//i.test(u))u='https://'+u;
  return /^https?:\/\/[^\s]+$/i.test(u)?u:'';
}
function telHref(p){return 'tel:'+String(p||'').replace(/[^\d+]/g,'')}

function payItem(it){
  var t=today(),d=effDue(it),isDeadline=it.type==='deadline';
  var hist=(it.history||[]).concat([{date:t,due:d,by:S.uid}]).slice(-24);
  var patch={history:hist};
  if(HREPEAT_MONTHS[it.repeat]){patch.due=addMonthsKeep(d,HREPEAT_MONTHS[it.repeat],it.day)}else{patch.done=true}
  col('house').patch(it.id,patch);
  if(!isDeadline&&Number(it.amount)>0)col('txns').add({type:'expense',amount:Number(it.amount),cat:it.cat||'bills',date:t,who:S.uid,note:it.name});
  toast(isDeadline?'Marked done':(patch.due?'Paid. Next due '+dayLabel(patch.due):'Marked paid'));
}

    :it.autopay?null:h('button',{class:'btn sm'+(x.late?'':' primary'),type:'button',onclick:function(){payItem(it)}},it.type==='deadline'?'Done':(x.late?'Pay now':'Mark paid'));
  return h('div',{class:'item'},icoTile(isCancel?'bell':ty[2],isCancel?'var(--over)':ty[3]),

/* iPhone / Google / Outlook calendar file with repeating events and alerts */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFold(line){var out=[],s=line;while(s.length>73){out.push(s.slice(0,73));s=' '+s.slice(73)}out.push(s);return out.join('\r\n')}
function icsAlarm(days,desc){
  // All-day events start at midnight; fire at 9am "days" before.
  var trig=days<=0?'PT9H':'-P'+(days-1)+'DT15H';
  return ['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(desc),'TRIGGER:'+trig,'END:VALARM'];
}
function houseIcs(){
  var stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gundavaram//Household//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Gundavaram household'];
  houseItems().forEach(function(it){
    var ty=htype(it.type),link=safeUrl(it.link);
    var desc=[ty[1]+(it.provider?' · '+it.provider:''),Number(it.amount)>0?'Amount: '+money(it.amount):'',it.autopay?'Autopay is on':'',it.phone?'Phone: '+it.phone:'',link?'Website: '+link:'',it.docs?'Papers: '+it.docs:''].filter(Boolean).join('\n');
    if(it.due){
      var d=effDue(it),rem=it.remind===''||it.remind==null?defRemind(it.repeat):Number(it.remind),n=HREPEAT_MONTHS[it.repeat];
      L.push('BEGIN:VEVENT','UID:'+it.id+'-due@nourish-household','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(d,1).replace(/-/g,''),
        'SUMMARY:'+icsEsc((it.type==='insurance'?'Renew: ':it.type==='deadline'?'Due: ':it.autopay?'Autopay: ':'Pay: ')+it.name+(Number(it.amount)>0?' ('+money(it.amount)+')':'')),
        'DESCRIPTION:'+icsEsc(desc),link?'URL:'+link:'');
      if(n){var rr='RRULE:FREQ=MONTHLY;INTERVAL='+n;if(it.day>=29)rr+=';BYMONTHDAY=-1';if(it.endDate)rr+=';UNTIL='+it.endDate.replace(/-/g,'');L.push(rr)}
      L=L.concat(rem>0?icsAlarm(rem,it.name+' is coming up'):[],icsAlarm(0,it.name+' is due today'));
      L.push('END:VEVENT');
    }
    if(it.type==='subscription'&&it.cancelBy&&!it.cancelDone){
      L.push('BEGIN:VEVENT','UID:'+it.id+'-cancel@nourish-household','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+it.cancelBy.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(it.cancelBy,1).replace(/-/g,''),
        'SUMMARY:'+icsEsc('Cancel by today: '+it.name),'DESCRIPTION:'+icsEsc(desc),link?'URL:'+link:'');
      L=L.concat(icsAlarm(7,'Decide whether to cancel '+it.name),icsAlarm(0,'Last day to cancel '+it.name));
      L.push('END:VEVENT');
    }
  });
  L.push('END:VCALENDAR');
  return L.filter(Boolean).map(icsFold).join('\r\n');
}
function exportHouseCal(){
  if(!houseItems().length){toast('Add something first.');return}
  var file='nourish-household.ics',blob=new Blob([houseIcs()],{type:'text/calendar'});
  // iPhone Home Screen apps can't download files; the share sheet can hand the file to Calendar.
  var standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(standalone&&navigator.canShare){try{var f=new File([blob],file,{type:'text/calendar'});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Household reminders'}).catch(function(){});return}}catch(e){}}
  var a=h('a',{href:URL.createObjectURL(blob),download:file});document.body.append(a);a.click();a.remove();
  toast('Calendar file ready. Open it to add the reminders.');
}

/* Copy old Money → Bills into Household once (safe to run on every device). */
function migrateBills(){
  function run(){
    var B=col('bills'),H=col('house');if(!B.ready||!H.ready||!B.items.length)return;
    var t=today(),mk=monthKey(t);
    B.items.slice().forEach(function(b){
      var id='bill-'+b.id;
      if(!H.map[id]){
        var due=b.paid&&b.paid[mk]?billDue(b,monthKey(addMonthsKeep(mk+'-01',1))):billDue(b,mk);
        var isLoan=/mortgage|rent|loan|lease/i.test(b.name||'');
        H.save({id:id,type:isLoan?'loan':'utility',name:b.name,amount:Number(b.amount)||0,repeat:'monthly',due:due,day:Number(b.day)||1,remind:'',autopay:false,cat:b.cat||'bills',link:'',phone:'',by:b.by||S.uid,at:Date.now()});
      }
      B.del(b.id);
    });
  }
  col('bills').on(run);col('house').on(run);
}

/* Page */
function pageHouse(el){
  var filter='all';
  var seg=h('div',{class:'chips scroll'}),body=h('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}});
  el.append(pageHead('Household','Insurance, bills, subscriptions and deadlines',[h('button',{class:'btn sm nowrap',type:'button',onclick:calHelp},ico('bell'),'Reminders')]),seg,body,
    fab('Add',function(){houseForm(null,filter==='all'?'utility':filter)}));
  function drawSeg(){
    seg.replaceChildren();
    [['all','All']].concat(HTYPES.map(function(t){return [t[0],t[1]]})).forEach(function(o){
      var n=o[0]==='all'?houseItems().length:houseItems().filter(function(x){return x.type===o[0]}).length;
      seg.append(h('button',{class:'chip',type:'button','aria-pressed':filter===o[0]?'true':'false',onclick:function(){filter=o[0];upd()}},o[1]+(n?' · '+n:'')));
    });
  }
  function upd(){
    drawSeg();body.replaceChildren();
    var due=houseDue().filter(function(x){return filter==='all'||x.it.type===filter});
    if(due.length){
      var c=h('section',{class:'card'});c.append(h('div',{class:'chead'},icoTile('bell','var(--over)'),h('h2',{text:'Coming due'})));
      var l=h('div',{class:'list'});due.forEach(function(x){l.append(dueRow(x))});c.append(l);body.append(c);
    }
    var types=filter==='all'?HTYPES:HTYPES.filter(function(t){return t[0]===filter});
    var any=false;
    types.forEach(function(ty){
      var items=houseItems().filter(function(x){return x.type===ty[0]}).sort(function(a,b){return effDue(a)<effDue(b)?-1:1});
      if(!items.length&&filter==='all')return;
      any=any||items.length>0;
      var c=h('section',{class:'card'});
      var monthly=sum(items,function(x){var n=HREPEAT_MONTHS[x.repeat];return n?(Number(x.amount)||0)/n:0});
      c.append(h('div',{class:'chead'},icoTile(ty[2],ty[3]),h('div',{class:'grow'},h('h2',{text:ty[1]}),monthly>0?h('div',{class:'muted small',text:'About '+money(monthly)+' a month'}):null),
        h('button',{class:'more',type:'button',onclick:function(){houseForm(null,ty[0])}},'+ Add')));
      var l=h('div',{class:'list'});
      items.forEach(function(it){
        var d=it.due?effDue(it):'',link=safeUrl(it.link);
        l.append(h('div',{class:'item'},
          h('button',{class:'t',type:'button',style:{background:'none',border:0,textAlign:'left',padding:0},onclick:function(){houseDetail(it)}},
            h('b',{text:it.name}),
            h('small',{text:[it.provider,Number(it.amount)>0?money(it.amount)+(HREPEAT_MONTHS[it.repeat]?' / '+({1:'mo',3:'qtr',12:'yr'})[HREPEAT_MONTHS[it.repeat]]:''):'',d?(it.type==='insurance'?'renews ':'due ')+dayLabel(d):''].filter(Boolean).join(' · ')})),
          it.autopay?h('span',{class:'pill green',text:'Autopay'}):null,
          link?h('a',{class:'ibtn plain',href:link,target:'_blank',rel:'noopener noreferrer','aria-label':'Open '+it.name+' website'},ico('link')):null,
          it.phone?h('a',{class:'ibtn plain',href:telHref(it.phone),'aria-label':'Call '+it.name},ico('phone')):null));
      });
      if(!items.length)l.append(emptyState(ty[2],'Nothing here yet. Tap “+ Add”.'));
      c.append(l);body.append(c);
    });
    if(!any&&filter==='all'){
      body.append(h('section',{class:'card'},emptyState('key','Keep insurance, utilities, mortgage, subscriptions and other deadlines in one place, with reminders before each one is due.',
        h('button',{class:'btn primary',type:'button',onclick:function(){houseForm()}},'Add the first one'))));
    }
    var done=col('house').items.filter(function(x){return x.done});
    if(done.length&&filter==='all'){
      var dl=h('div',{class:'list'});
      done.forEach(function(it){dl.append(h('div',{class:'item done'},h('button',{class:'t',type:'button',style:{background:'none',border:0,textAlign:'left',padding:0},onclick:function(){houseForm(it)}},h('b',{text:it.name}),h('small',{text:it.cancelled?'Cancelled '+dayLabel(it.cancelled):'Finished'}))))});
      body.append(h('details',{class:'card'},h('summary',{style:{fontWeight:'600',cursor:'pointer'}},'Finished and cancelled ('+done.length+')'),dl));
    }
  }
  return upd;
}
